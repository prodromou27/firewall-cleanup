# Serves the built SPA and proxies /api to the backend container.
# The app is served same-origin (browser → nginx → backend), so the session
# cookie and CSRF Origin checks work without cross-origin gymnastics.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cap upload size in line with the backend (max_upload_size_mb default 100).
    client_max_body_size 100m;

    # API → backend service on the compose network.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    # SPA fallback — client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
