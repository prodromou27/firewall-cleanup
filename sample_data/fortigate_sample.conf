#config-version=FGT60F-v7.2.0-build0866-220718:opmode=0:vdom=0:user=admin
# FortiGate Sample Configuration for Testing - Firewall Policy Cleanup Assistant
#

config firewall address
    edit "LAN-Network"
        set subnet 192.168.1.0 255.255.255.0
        set comment "Internal LAN"
    next
    edit "DMZ-Network"
        set subnet 10.10.20.0 255.255.255.0
        set comment "DMZ Zone"
    next
    edit "Server-Web-01"
        set subnet 10.10.20.10 255.255.255.255
        set comment "Web Server 01"
    next
    edit "Server-Web-02"
        set subnet 10.10.20.11 255.255.255.255
        set comment "Web Server 02"
    next
    edit "Server-DB-01"
        set subnet 10.10.20.50 255.255.255.255
        set comment "Database Server"
    next
    edit "Host-SRV-10-20-10"
        set subnet 10.10.20.10 255.255.255.255
        set comment "Duplicate of Server-Web-01"
    next
    edit "Old-Server"
        set subnet 10.10.20.99 255.255.255.255
        set comment "Decommissioned server - not used"
    next
    edit "Broad-Internal"
        set subnet 10.0.0.0 255.0.0.0
        set comment "Very broad internal range"
    next
    edit "Management-Subnet"
        set subnet 192.168.100.0 255.255.255.0
        set comment "Management network"
    next
end

config firewall addrgrp
    edit "Web-Servers"
        set member "Server-Web-01" "Server-Web-02"
        set comment "Web server group"
    next
    edit "All-Servers"
        set member "Web-Servers" "Server-DB-01"
        set comment "All servers group"
    next
    edit "Empty-Group"
        set comment "Empty group - no members"
    next
end

config firewall service custom
    edit "HTTPS"
        set tcp-portrange 443
        set comment "HTTPS"
    next
    edit "HTTP"
        set tcp-portrange 80
        set comment "HTTP"
    next
    edit "RDP"
        set tcp-portrange 3389
        set comment "Remote Desktop Protocol"
    next
    edit "SSH-Custom"
        set tcp-portrange 22
        set comment "SSH"
    next
    edit "SQL-Server"
        set tcp-portrange 1433
        set comment "Microsoft SQL Server"
    next
    edit "Wide-Range"
        set tcp-portrange 1024-65535
        set comment "Very wide port range"
    next
    edit "HTTPS-Duplicate"
        set tcp-portrange 443
        set comment "Duplicate of HTTPS service"
    next
end

config firewall service group
    edit "Web-Services"
        set member "HTTPS" "HTTP"
        set comment "Web services group"
    next
end

config firewall policy
    edit 1
        set name "Allow-LAN-to-Internet"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "LAN-Network"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "all"
        set logtraffic all
        set status enable
        set comments "Allow all LAN users to Internet - review scope"
        set hitc 15234
    next
    edit 2
        set name "Allow-Web-Access"
        set srcintf "wan1"
        set dstintf "dmz"
        set srcaddr "all"
        set dstaddr "Web-Servers"
        set action accept
        set schedule "always"
        set service "Web-Services"
        set logtraffic all
        set status enable
        set comments "Allow external web access to web servers"
        set hitc 8421
    next
    edit 3
        set name "Allow-RDP-Admin"
        set srcintf "wan1"
        set dstintf "dmz"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "RDP"
        set logtraffic disable
        set status enable
        set comments "Admin RDP access - HIGH RISK"
        set hitc 42
    next
    edit 4
        set name "Allow-SSH-Temp"
        set srcintf "internal"
        set dstintf "dmz"
        set srcaddr "LAN-Network"
        set dstaddr "All-Servers"
        set action accept
        set schedule "always"
        set service "SSH-Custom"
        set logtraffic all
        set status enable
        set comments "Temp SSH access for migration"
        set hitc 5
    next
    edit 5
        set name "Allow-DB-Access"
        set srcintf "dmz"
        set dstintf "internal"
        set srcaddr "Web-Servers"
        set dstaddr "Server-DB-01"
        set action accept
        set schedule "always"
        set service "SQL-Server"
        set logtraffic all
        set status enable
        set comments "Web servers to database"
        set hitc 23451
    next
    edit 6
        set name "Disabled-Old-Rule"
        set srcintf "internal"
        set dstintf "dmz"
        set srcaddr "LAN-Network"
        set dstaddr "Server-Web-01"
        set action accept
        set schedule "always"
        set service "HTTP"
        set logtraffic all
        set status disable
        set comments "Old HTTP rule - disabled"
        set hitc 0
    next
    edit 7
        set name "Allow-LAN-to-Web-Duplicate"
        set srcintf "wan1"
        set dstintf "dmz"
        set srcaddr "all"
        set dstaddr "Web-Servers"
        set action accept
        set schedule "always"
        set service "Web-Services"
        set logtraffic all
        set status enable
        set comments "Duplicate of rule 2"
        set hitc 0
    next
    edit 8
        set name "Shadowed-HTTPS-Rule"
        set srcintf "wan1"
        set dstintf "dmz"
        set srcaddr "all"
        set dstaddr "Server-Web-01"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set logtraffic all
        set status enable
        set comments "Shadowed by rule 2 - web servers group includes Server-Web-01"
        set hitc 0
    next
    edit 9
        set name "Zero-Hit-Legacy"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "Management-Subnet"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "Wide-Range"
        set logtraffic all
        set status enable
        set comments "Legacy rule - zero hits"
        set hitc 0
    next
    edit 10
        set name "Any-Any-Any"
        set srcintf "internal"
        set dstintf "dmz"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "all"
        set logtraffic disable
        set status enable
        set comments "Overly permissive - any to any"
        set hitc 1234
    next
    edit 11
        set name "No-Log-Allow"
        set srcintf "internal"
        set dstintf "dmz"
        set srcaddr "LAN-Network"
        set dstaddr "Server-Web-02"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set logtraffic disable
        set status enable
        set comments "Allow rule with no logging"
        set hitc 334
    next
    edit 12
        set name "test-migration-rule"
        set srcintf "internal"
        set dstintf "dmz"
        set srcaddr "LAN-Network"
        set dstaddr "Server-DB-01"
        set action accept
        set schedule "always"
        set service "SQL-Server"
        set logtraffic all
        set status enable
        set comments "test rule from migration project - delete after validation"
        set hitc 2
    next
end
